name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Release Gate Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: marmot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Financial Test DB Bootstrap
        env:
          DISPOSABLE_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/marmot_test
        run: node scripts/setup-test-db.mjs

      - name: Real Supabase Local Bootstrap
        run: |
          npx supabase start -x studio,inbucket,storage,realtime,analytics,edge_runtime
          npx supabase status -o env > /tmp/supabase-status.env
          npx supabase migration up --local

      - name: Auth Fixture Bootstrap
        run: node scripts/bootstrap-disposable-supabase.mjs

      - name: Backend Start
        run: |
          if [ -f /tmp/supabase-disposable.env ]; then
            set -a
            source /tmp/supabase-disposable.env
            set +a
          fi
          CI=true MARMOT_TEST_MODE=true nohup node dist/server.cjs > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Backend Healthcheck
        run: |
          echo "Waiting for backend server to become healthy on http://localhost:3000/api/health..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:3000/api/health > /dev/null; then
              echo "Backend server is healthy!"
              exit 0
            fi
            echo "Waiting for backend... attempt $i"
            sleep 1
          done
          echo "Backend failed to become healthy within 30 seconds. Logs:"
          cat /tmp/server.log
          exit 1

      - name: Integration Tests
        env:
          CI: true
          MARMOT_TEST_MODE: true
        run: |
          if [ -f /tmp/supabase-disposable.env ]; then
            set -a
            source /tmp/supabase-disposable.env
            set +a
          fi
          npm run test:integration

      - name: Concurrency Tests
        env:
          CI: true
          MARMOT_TEST_MODE: true
          DISPOSABLE_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/marmot_test
        run: |
          if [ -f /tmp/supabase-disposable.env ]; then
            set -a
            source /tmp/supabase-disposable.env
            set +a
          fi
          npm run test:concurrency

      - name: Working Tree Clean Check
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: tests changed repository files"
            git status --porcelain
            exit 1
          fi

      - name: Shutdown Supabase Local
        if: always()
        run: npx supabase stop || true

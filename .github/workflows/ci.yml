name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Start Backend Server & Healthcheck
        run: |
          CI=true MARMOT_TEST_MODE=true nohup node dist/server.cjs > /tmp/server.log 2>&1 &
          echo "Waiting for backend server to become healthy on http://localhost:3000/api/health..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:3000/api/health > /dev/null; then
              echo "Backend server is healthy!"
              exit 0
            fi
            echo "Waiting for backend... attempt $i"
            sleep 1
          done
          echo "Backend failed to become healthy within 30 seconds. Logs:"
          cat /tmp/server.log
          exit 1

      - name: Run Integration Tests
        env:
          CI: true
          MARMOT_TEST_MODE: true
          TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
          TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npm run test:integration

      - name: Working Tree Clean Check
        run: git diff --exit-code

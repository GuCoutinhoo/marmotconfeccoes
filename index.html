<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>MARMOT | Streetwear Autoral &amp; E-commerce</title>
    <meta name="description" content="E-commerce completo de moda streetwear autoral com catálogo dinâmico, checkout seguro via InfinitePay, cotação de frete Melhor Envio, autenticação e painel administrativo com persistência em banco de dados." />
    
    <!-- Preload Deterministic Marmot Sans Fonts for zero-FOUT rendering across all environments -->
    <link rel="preload" href="/fonts/marmot-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/marmot-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/marmot-sans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/marmot-sans-800.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google Fonts: Archivo Black & Inter for consistent cross-browser & Vercel typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Preconnect & DNS-Prefetch for ultra-fast CDN/Image loading -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://i.postimg.cc" crossorigin />
    <link rel="dns-prefetch" href="https://i.postimg.cc" />

    <meta property="og:title" content="MARMOT | Streetwear Autoral & E-commerce" />
    <meta property="og:description" content="E-commerce completo de moda streetwear autoral com catálogo dinâmico, checkout seguro via InfinitePay, cotação de frete Melhor Envio, autenticação e painel administrativo com persistência em banco de dados." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#F8F9FA] text-[#18181B] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
